<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#140a24">
<title>Max, assistant produits Hamster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root {
    /* Couleurs de marque Hamster */
    --night: #140a24;
    --night-2: #1c0f33;
    --violet: #6a2c91;
    --violet-glow: #9a5bd0;
    --apricot: #f5a46e;
    --apricot-pale: #ffd2b3;
    --sage: #b3c797;
    --maple: #ef5a55;

    --ink: #fff5ec;
    --ink-80: rgba(255, 245, 236, .8);
    --ink-60: rgba(255, 245, 236, .6);
    --ink-40: rgba(255, 245, 236, .4);
    --line: rgba(255, 245, 236, .09);
    --line-2: rgba(255, 245, 236, .16);
    --glass: rgba(34, 18, 58, .55);

    --font: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --wrap: 860px;
    --app-h: 100dvh;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; background: var(--night); }
  body {
    height: var(--app-h);
    display: flex; flex-direction: column;
    overflow: hidden;
    font-family: var(--font);
    font-optical-sizing: auto;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--night-2), var(--night) 60%);
    -webkit-font-smoothing: antialiased;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--apricot); outline-offset: 3px; border-radius: 8px; }
  ::selection { background: rgba(245, 164, 110, .35); }

  /* ───────── Aurore : réagit à l'état de Max ───────── */
  .aurora {
    position: fixed; inset: -25%; z-index: 0; pointer-events: none;
    filter: blur(70px) saturate(1.15);
    opacity: .7;
    transition: opacity 1s var(--ease), transform 1.4s var(--ease);
  }
  .aurora span { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  .aurora .a1 { width: 60vmax; height: 60vmax; top: 0; right: 5%; background: radial-gradient(circle, rgba(154, 91, 208, .55), transparent 65%); animation: drift1 28s ease-in-out infinite alternate; }
  .aurora .a2 { width: 45vmax; height: 45vmax; bottom: 5%; left: 5%; background: radial-gradient(circle, rgba(245, 164, 110, .32), transparent 65%); animation: drift2 34s ease-in-out infinite alternate; }
  .aurora .a3 { width: 35vmax; height: 35vmax; top: 35%; left: 35%; background: radial-gradient(circle, rgba(106, 44, 145, .6), transparent 65%); animation: drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-12vmax, 10vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(14vmax, -8vmax) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-8vmax, -10vmax) scale(.85); } }
  body[data-state="thinking"] .aurora { opacity: 1; transform: scale(1.08); }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ───────── Barre du haut ───────── */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: calc(12px + env(safe-area-inset-top)) 22px 12px;
    border-bottom: 1px solid var(--line);
    background: rgba(20, 10, 36, .45);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .tile {
    flex: none; display: grid; place-items: center;
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--violet);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset, 0 6px 20px rgba(106, 44, 145, .45);
  }
  .tile svg { width: 58%; height: 58%; }
  .brand-name { font-size: 19px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  .brand-sep { width: 1px; height: 22px; background: var(--line-2); }
  .brand-max { font-size: 14px; color: var(--ink-60); line-height: 1.2; }
  .brand-max b { color: var(--ink); font-weight: 650; }
  .spacer { flex: 1; }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 13px 6px 11px; border-radius: 999px;
    font-size: 13px; color: var(--ink-80);
    background: rgba(255, 245, 236, .05); border: 1px solid var(--line);
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 10px var(--sage); }
  body[data-state="thinking"] .status i { background: var(--apricot); box-shadow: 0 0 10px var(--apricot); animation: blink 1s ease-in-out infinite; }
  body[data-state="offline"] .status i { background: var(--maple); box-shadow: 0 0 10px var(--maple); }
  @keyframes blink { 50% { opacity: .35; } }

  .lang {
    display: flex; padding: 3px; gap: 2px; border-radius: 999px;
    background: rgba(255, 245, 236, .05); border: 1px solid var(--line);
  }
  .lang button {
    border: 0; background: transparent; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-60);
    transition: background .2s, color .2s;
  }
  .lang button:hover { color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--night); }

  .new-chat {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-2); background: transparent;
    font-size: 13.5px; font-weight: 550;
    transition: background .2s, border-color .2s;
  }
  .new-chat:hover { background: rgba(255, 245, 236, .07); border-color: var(--ink-40); }
  .new-chat svg { width: 16px; height: 16px; }
  body.is-empty .new-chat { display: none; }

  /* ───────── Zone principale ───────── */
  main {
    position: relative; z-index: 5;
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  body.is-empty main { justify-content: center; padding-bottom: 6vh; }
  .wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 22px; }

  /* Accueil */
  .hero { text-align: center; padding: 0 22px 34px; }
  body:not(.is-empty) .hero { display: none; }
  .core { position: relative; width: 92px; height: 92px; margin: 0 auto 26px; }
  .core .tile { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 28px; box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 18px 50px rgba(106, 44, 145, .6); }
  .core .ring {
    position: absolute; inset: -9px; border-radius: 35px; padding: 1.5px;
    background: conic-gradient(from var(--spin), transparent 0 55%, var(--apricot) 75%, var(--violet-glow) 90%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 6s linear infinite;
  }
  .core .live {
    position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--sage); border: 4px solid var(--night);
  }
  @keyframes spin { to { --spin: 360deg; } }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) .15s forwards; }
  .draw + .draw { animation-delay: .55s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hero h1 {
    font-size: clamp(38px, 6.2vw, 64px);
    font-weight: 720; letter-spacing: -.04em; line-height: 1;
    font-variation-settings: 'opsz' 96;
    text-wrap: balance;
  }
  .hero p {
    margin: 16px auto 0; max-width: 540px;
    font-size: 17px; line-height: 1.55; color: var(--ink-60);
    text-wrap: pretty;
  }
  .rise { opacity: 0; transform: translateY(14px); animation: rise .8s var(--ease) forwards; }
  .d1 { animation-delay: .35s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .65s; } .d4 { animation-delay: .8s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* Fil de conversation */
  .thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
  body.is-empty .thread { display: none; }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: rgba(255, 245, 236, .14); border-radius: 999px; }
  .messages { display: flex; flex-direction: column; gap: 26px; padding-top: 30px; padding-bottom: 24px; }

  .msg { animation: pop .45s var(--ease) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } }
  .msg-user {
    align-self: flex-end; max-width: min(80%, 580px);
    padding: 13px 18px; border-radius: 22px 22px 6px 22px;
    background: var(--violet); box-shadow: 0 8px 26px rgba(106, 44, 145, .35);
    font-size: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg-max { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; align-items: start; }
  .msg-max .tile { width: 34px; height: 34px; border-radius: 11px; }
  .msg-max .content { min-width: 0; padding-top: 5px; }
  .msg-error .content p { color: var(--apricot-pale); line-height: 1.55; }
  .msg-error .tile { background: #5a2330; }

  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .act {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent;
    font-size: 12.5px; color: var(--ink-60);
    transition: color .2s, border-color .2s, background .2s;
  }
  .act:hover { color: var(--ink); border-color: var(--line-2); background: rgba(255, 245, 236, .05); }
  .act svg { width: 14px; height: 14px; }
  .act.done { color: var(--sage); border-color: rgba(179, 199, 151, .4); }

  .pending .tile { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.9); box-shadow: 0 0 0 6px rgba(154, 91, 208, .18), 0 6px 20px rgba(106, 44, 145, .45); } }
  .shimmer {
    display: inline-block; font-size: 16px;
    background: linear-gradient(90deg, var(--ink-40) 0%, var(--ink) 40%, var(--ink-40) 80%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.8s linear infinite;
  }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* Réponses de Max (Markdown) */
  .md { font-size: 16px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }
  .md > * + * { margin-top: 12px; }
  .md strong { font-weight: 650; color: var(--apricot-pale); }
  .md a { color: var(--apricot); text-underline-offset: 3px; }
  .md a:hover { color: var(--apricot-pale); }
  .md h1, .md h2, .md h3, .md h4 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; margin-top: 18px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li + li { margin-top: 6px; }
  .md li::marker { color: var(--apricot); }
  .md code { white-space: nowrap; font-family: var(--mono); font-size: .86em; padding: 2px 7px; border-radius: 6px; background: rgba(255, 245, 236, .09); color: var(--apricot-pale); }
  .md pre { padding: 14px 16px; border-radius: 14px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); overflow-x: auto; }
  .md pre code { white-space: pre; padding: 0; background: none; color: var(--ink-80); }
  .md blockquote { padding-left: 14px; border-left: 3px solid var(--violet-glow); color: var(--ink-80); }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  .md img { max-width: 100%; border-radius: 12px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 245, 236, .03); }
  .md table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .md th { text-align: left; padding: 10px 14px; font-weight: 650; color: var(--ink-80); background: rgba(255, 245, 236, .05); border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .md td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }

  /* ───────── Zone d'écriture ───────── */
  .dock { position: relative; z-index: 6; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  body:not(.is-empty) .dock { background: linear-gradient(to bottom, transparent, rgba(20, 10, 36, .7) 30%); }

  .composer {
    position: relative; view-transition-name: composer;
    border-radius: 26px;
    background: var(--glass);
    border: 1px solid var(--line-2);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .02) inset;
    transition: border-color .25s, box-shadow .25s;
  }
  .composer:focus-within { border-color: rgba(245, 164, 110, .55); box-shadow: 0 24px 60px rgba(0, 0, 0, .35), 0 0 0 4px rgba(245, 164, 110, .1); }
  /* Bordure lumineuse qui tourne pendant que Max cherche */
  .composer::before {
    content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--spin), transparent 0 50%, var(--apricot) 72%, var(--violet-glow) 88%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .4s;
  }
  body[data-state="thinking"] .composer::before { opacity: 1; animation: spin 2.2s linear infinite; }

  .composer textarea {
    display: block; width: 100%;
    min-height: 88px; max-height: 42vh;
    padding: 20px 22px 6px;
    border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 17px; line-height: 1.5; color: var(--ink);
    overflow-y: auto;
  }
  .composer textarea::placeholder { color: var(--ink-40); }
  .composer-bar { display: flex; align-items: center; gap: 12px; padding: 8px 10px 10px 22px; }
  .hint { flex: 1; font-size: 12.5px; color: var(--ink-40); }
  .hint kbd { font-family: var(--font); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--ink-60); }
  .send {
    flex: none; display: grid; place-items: center;
    width: 46px; height: 46px; border-radius: 16px; border: 0; cursor: pointer;
    background: var(--apricot); color: #2c1407;
    box-shadow: 0 8px 24px rgba(245, 164, 110, .35);
    transition: transform .2s var(--ease), background .2s, opacity .2s, box-shadow .2s;
  }
  .send:hover:not(:disabled) { background: var(--apricot-pale); transform: translateY(-1px); }
  .send:active:not(:disabled) { transform: scale(.94); }
  .send:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .send svg { width: 20px; height: 20px; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  body:not(.is-empty) .chips { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 245, 236, .04); border: 1px solid var(--line-2);
    font-size: 14px; color: var(--ink-80);
    transition: border-color .2s, color .2s, background .2s, transform .2s var(--ease);
  }
  .chip:hover { border-color: var(--apricot); color: var(--ink); background: rgba(245, 164, 110, .08); transform: translateY(-2px); }
  .chip svg { width: 15px; height: 15px; color: var(--apricot); }

  .note { margin-top: 10px; text-align: center; font-size: 12px; color: var(--ink-40); }

  /* Transition accueil → conversation */
  ::view-transition-group(composer) { animation-duration: .6s; animation-timing-function: var(--ease); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }

  /* ───────── Téléphone ───────── */
  @media (max-width: 640px) {
    .topbar { gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
    .tile { width: 34px; height: 34px; border-radius: 11px; }
    .brand { gap: 10px; }
    .brand-name { font-size: 17px; }
    .brand-sep, .status, .brand-max > span { display: none; }
    .brand-max { font-size: 17px; color: var(--apricot); }
    .brand-max b { color: inherit; font-weight: 750; letter-spacing: -.02em; }
    .new-chat { padding: 8px; }
    .new-chat span { display: none; }
    .lang button { padding: 6px 10px; }

    body.is-empty main { justify-content: flex-end; padding-bottom: 0; }
    .hero { padding: 0 18px 22px; }
    .core { width: 72px; height: 72px; margin-bottom: 20px; }
    .core .tile { border-radius: 22px; }
    .core .ring { border-radius: 29px; inset: -8px; }
    .hero p { font-size: 15.5px; margin-top: 12px; }

    .wrap { padding: 0 12px; }
    .messages { gap: 22px; padding-top: 20px; }
    .msg-user { max-width: 88%; font-size: 15.5px; }
    .msg-max { grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
    .msg-max .tile { width: 28px; height: 28px; border-radius: 9px; }
    .md { font-size: 15.5px; }
    .md table { min-width: 520px; }

    .dock { padding-top: 8px; }
    .composer { border-radius: 22px; }
    .composer textarea { min-height: 64px; max-height: 34vh; font-size: 16px; padding: 16px 16px 4px; }
    .composer-bar { padding: 6px 8px 8px 16px; }
    .hint { visibility: hidden; }
    .send { width: 44px; height: 44px; border-radius: 14px; }

    .chips { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin: 12px -12px 0; padding: 0 12px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; font-size: 13.5px; }
    .note { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .draw { stroke-dashoffset: 0; }
    .rise { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="is-empty" data-state="idle">

<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="tile"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="6" stroke="#fff5ec" stroke-width="3.4"/><polyline points="3,37 3,13 13,3" stroke="#fff5ec" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="brand-name">Hamster</span>
    <span class="brand-sep"></span>
    <span class="brand-max"><b>Max</b> <span data-i18n="tagline">Assistant produits</span></span>
  </div>
  <div class="spacer"></div>
  <div class="status" role="status"><i></i><span id="statusText">En ligne</span></div>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button type="button" data-lang="fr" aria-pressed="true">FR</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button type="button" class="new-chat" id="newChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span data-i18n="newChat">Nouvelle conversation</span>
  </button>
</header>

<main>
  <section class="hero">
    <div class="core">
      <div class="ring"></div>
      <div class="tile"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect class="draw" pathLength="1" x="3" y="3" width="34" height="34" rx="6" stroke="#fff5ec" stroke-width="3"/><polyline class="draw" pathLength="1" points="3,37 3,13 13,3" stroke="#fff5ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="live"></div>
    </div>
    <h1 class="rise d1" data-i18n="heroTitle">Bonjour, je suis Max.</h1>
    <p class="rise d2" data-i18n="heroDesc"></p>
  </section>

  <div class="thread" id="thread">
    <div class="messages wrap" id="messages" aria-live="polite"></div>
  </div>

  <div class="dock">
    <div class="wrap">
      <div class="composer rise d3">
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <div class="composer-bar">
          <span class="hint" id="hint"></span>
          <button type="button" class="send" id="send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="chips rise d4" id="chips"></div>
      <p class="note" data-i18n="note"></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(() => {
  /* Même webhook que l'ancienne interface : aucun changement côté n8n */
  const WEBHOOK = 'https://n8n.srv1163870.hstgr.cloud/webhook/79723dfd-52fa-4e30-8def-23c0b48aebab/chat';
  const STORE = 'max-chat-v5';
  const TIMEOUT_MS = 120000;

  const ICONS = {
    search: '<path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/>',
    plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
    compare: '<path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>',
    swap: '<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    retry: '<path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>'
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  const MARK = '<div class="tile"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="6" stroke="#fff5ec" stroke-width="3.6"/><polyline points="3,37 3,13 13,3" stroke="#fff5ec" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

  const COPY = {
    fr: {
      tagline: 'Assistant produits',
      newChat: 'Nouvelle conversation',
      heroTitle: 'Bonjour, je suis Max.',
      heroDesc: 'Posez-moi vos questions sur le catalogue Hamster : numéro de pièce, compatibilité, caractéristiques ou produit équivalent.',
      placeholder: 'Écrivez votre question à Max…',
      hint: '<kbd>Entrée</kbd> pour envoyer, <kbd>Maj</kbd> + <kbd>Entrée</kbd> pour aller à la ligne',
      note: 'Max peut se tromper. Vérifiez les informations importantes avant de les transmettre à un client.',
      send: 'Envoyer',
      status: { idle: 'En ligne', thinking: 'Max cherche…', offline: 'Hors ligne' },
      thinking: 'Max cherche dans le catalogue',
      copy: 'Copier', copied: 'Copié',
      retry: 'Réessayer',
      error: "Max n'a pas pu répondre. Vérifiez votre connexion, puis réessayez.",
      timeout: 'Max met trop de temps à répondre. Réessayez dans un instant.',
      empty: "Max n'a renvoyé aucune réponse. Reformulez la question ou réessayez.",
      chips: [
        ['search', 'Trouver une référence', 'Trouve-moi le produit avec le numéro de pièce '],
        ['plug', 'Vérifier une compatibilité', 'Est-ce que ce produit est compatible avec '],
        ['list', 'Voir les caractéristiques', 'Donne-moi les caractéristiques de '],
        ['swap', 'Trouver un équivalent', 'Propose-moi un produit équivalent à ']
      ]
    },
    en: {
      tagline: 'Product assistant',
      newChat: 'New conversation',
      heroTitle: "Hi, I'm Max.",
      heroDesc: 'Ask me anything about the Hamster catalogue: part numbers, compatibility, specifications or an equivalent product.',
      placeholder: 'Type your question for Max…',
      hint: '<kbd>Enter</kbd> to send, <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line',
      note: 'Max can make mistakes. Double-check important details before sharing them with a customer.',
      send: 'Send',
      status: { idle: 'Online', thinking: 'Max is searching…', offline: 'Offline' },
      thinking: 'Max is searching the catalogue',
      copy: 'Copy', copied: 'Copied',
      retry: 'Try again',
      error: "Max couldn't reply. Check your connection, then try again.",
      timeout: 'Max is taking too long to reply. Try again in a moment.',
      empty: 'Max returned an empty reply. Rephrase the question or try again.',
      chips: [
        ['search', 'Find a part number', 'Find the product with part number '],
        ['plug', 'Check compatibility', 'Is this product compatible with '],
        ['list', 'See specifications', 'Give me the specifications of '],
        ['swap', 'Find an equivalent', 'Suggest a product equivalent to ']
      ]
    }
  };

  const $ = (s) => document.querySelector(s);
  const body = document.body;
  const input = $('#input'), sendBtn = $('#send'), messagesEl = $('#messages'), thread = $('#thread');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

  function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } }
  function save() { try { chat.messages = chat.messages.slice(-60); localStorage.setItem(STORE, JSON.stringify(chat)); } catch {} }

  let chat = load() || { sessionId: uuid(), messages: [] };
  if (!chat.sessionId || !Array.isArray(chat.messages)) chat = { sessionId: uuid(), messages: [] };
  let lang = (() => { try { return localStorage.getItem('max-lang'); } catch { return null; } })() || 'fr';
  if (!COPY[lang]) lang = 'fr';
  let busy = false;
  const t = () => COPY[lang];

  /* ─── Markdown sécurisé ─── */
  if (window.DOMPurify) {
    DOMPurify.addHook('afterSanitizeAttributes', n => {
      if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
    });
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function renderMarkdown(text) {
    if (window.marked && window.DOMPurify) {
      const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      tpl.content.querySelectorAll('table').forEach(tb => {
        const w = document.createElement('div'); w.className = 'table-wrap';
        tb.replaceWith(w); w.appendChild(tb);
      });
      return tpl.innerHTML;
    }
    return '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>';
  }

  /* ─── Affichage des messages ─── */
  function userEl(text) {
    const d = document.createElement('div');
    d.className = 'msg msg-user';
    d.textContent = text;
    return d;
  }
  function maxEl(text) {
    const d = document.createElement('div');
    d.className = 'msg msg-max';
    d.innerHTML = `${MARK}<div class="content"><div class="md">${renderMarkdown(text)}</div>
      <div class="actions"><button type="button" class="act copy">${icon('copy')}<span>${t().copy}</span></button></div></div>`;
    d.querySelector('.copy').addEventListener('click', (e) => copyText(text, e.currentTarget));
    return d;
  }
  function pendingEl() {
    const d = document.createElement('div');
    d.className = 'msg msg-max pending';
    d.innerHTML = `${MARK}<div class="content"><span class="shimmer">${t().thinking}…</span></div>`;
    return d;
  }
  function errorEl(msg, retryText) {
    const d = document.createElement('div');
    d.className = 'msg msg-max msg-error';
    d.innerHTML = `${MARK}<div class="content"><p></p><div class="actions"><button type="button" class="act">${icon('retry')}<span>${t().retry}</span></button></div></div>`;
    d.querySelector('p').textContent = msg;
    d.querySelector('button').addEventListener('click', () => { d.remove(); ask(retryText, true); });
    return d;
  }
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    btn.classList.add('done');
    btn.innerHTML = `${icon('check')}<span>${t().copied}</span>`;
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = `${icon('copy')}<span>${t().copy}</span>`; }, 1800);
  }
  function scrollToBottom() { thread.scrollTop = thread.scrollHeight; }
  function revealReply(el) {
    // Réponse longue : on montre son début ; sinon on descend en bas du fil.
    if (el.offsetHeight > thread.clientHeight * .7) thread.scrollTop = el.offsetTop - 20;
    else scrollToBottom();
  }

  /* ─── État (aurore, statut, bouton) ─── */
  function setState(s) {
    body.dataset.state = s;
    $('#statusText').textContent = t().status[s] || t().status.idle;
  }
  function refreshSend() { sendBtn.disabled = busy || !input.value.trim(); }
  function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
  function withTransition(fn) {
    if (document.startViewTransition && !reduceMotion) return document.startViewTransition(fn).updateCallbackDone.catch(() => {});
    fn(); return Promise.resolve();
  }

  /* ─── Appel au webhook n8n (même format que le widget @n8n/chat) ─── */
  function extractReply(raw) {
    let data;
    try { data = JSON.parse(raw); }
    catch {
      // Réponse en flux (streaming n8n) : une ligne JSON par morceau
      const parts = raw.split('\n').map(l => { try { return JSON.parse(l); } catch { return null; } })
        .filter(o => o && o.type === 'item' && typeof o.content === 'string').map(o => o.content);
      return parts.length ? parts.join('') : raw;
    }
    if (Array.isArray(data)) data = data[0] || {};
    const out = data.output ?? data.text ?? data.response ?? data.message ?? '';
    if (typeof out === 'string') return out;
    try { return JSON.stringify(out, null, 2); } catch { return String(out); }
  }

  async function ask(text, isRetry = false) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; refreshSend();

    const addUser = () => {
      body.classList.remove('is-empty');
      if (!isRetry) {
        messagesEl.appendChild(userEl(text));
        chat.messages.push({ role: 'user', text }); save();
      }
    };
    if (body.classList.contains('is-empty')) await withTransition(addUser); else addUser();

    input.value = ''; autosize(); refreshSend();
    setState('thinking');
    const pending = pendingEl();
    messagesEl.appendChild(pending);
    requestAnimationFrame(scrollToBottom);

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(WEBHOOK, {
        method: 'POST', mode: 'cors', cache: 'no-cache', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'sendMessage',
          sessionId: chat.sessionId,
          chatInput: text,
          metadata: { lang, source: 'max-web-v5' }
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const reply = extractReply(await res.text()).trim();
      pending.remove();
      if (!reply) { messagesEl.appendChild(errorEl(t().empty, text)); }
      else {
        const el = maxEl(reply);
        messagesEl.appendChild(el);
        chat.messages.push({ role: 'max', text: reply }); save();
        requestAnimationFrame(() => revealReply(el));
      }
    } catch (err) {
      pending.remove();
      messagesEl.appendChild(errorEl(err.name === 'AbortError' ? t().timeout : t().error, text));
      requestAnimationFrame(scrollToBottom);
    } finally {
      clearTimeout(timer);
      busy = false;
      setState(navigator.onLine ? 'idle' : 'offline');
      refreshSend();
      if (!touch) input.focus();
    }
  }

  /* ─── Langue ─── */
  function paintCopy() {
    const c = t();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = c[el.dataset.i18n]; });
    input.placeholder = c.placeholder;
    $('#hint').innerHTML = touch ? '' : c.hint;
    sendBtn.setAttribute('aria-label', c.send);
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.querySelectorAll('.copy:not(.done) span').forEach(s => { s.textContent = c.copy; });
    const chips = $('#chips');
    chips.innerHTML = '';
    c.chips.forEach(([ic, label, prefill]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.innerHTML = icon(ic) + `<span>${label}</span>`;
      b.addEventListener('click', () => {
        input.value = prefill; autosize(); refreshSend();
        input.focus(); input.setSelectionRange(prefill.length, prefill.length);
      });
      chips.appendChild(b);
    });
    setState(body.dataset.state);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('max-lang', lang); } catch {}
    paintCopy();
  }));

  /* ─── Nouvelle conversation ─── */
  $('#newChat').addEventListener('click', () => {
    if (busy) return;
    chat = { sessionId: uuid(), messages: [] }; save();
    withTransition(() => { messagesEl.innerHTML = ''; body.classList.add('is-empty'); });
    if (!touch) input.focus();
  });

  /* ─── Saisie ─── */
  input.addEventListener('input', () => { autosize(); refreshSend(); });
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const force = e.ctrlKey || e.metaKey;
    if (force || (!touch && !e.shiftKey)) { e.preventDefault(); ask(input.value); }
  });
  sendBtn.addEventListener('click', () => ask(input.value));

  /* ─── Réseau ─── */
  addEventListener('online', () => { if (!busy) setState('idle'); });
  addEventListener('offline', () => { if (!busy) setState('offline'); });

  /* ─── Hauteur réelle sur téléphone (clavier ouvert) ─── */
  function fitViewport() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    window.scrollTo(0, 0);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitViewport);
    visualViewport.addEventListener('scroll', fitViewport);
  }
  addEventListener('resize', fitViewport);
  fitViewport();

  /* ─── Démarrage : on restaure la conversation en cours ─── */
  paintCopy();
  if (chat.messages.length) {
    body.classList.remove('is-empty');
    chat.messages.forEach(m => {
      const el = m.role === 'user' ? userEl(m.text) : maxEl(m.text);
      el.style.animation = 'none';
      messagesEl.appendChild(el);
    });
    requestAnimationFrame(scrollToBottom);
  }
  setState(navigator.onLine ? 'idle' : 'offline');
  autosize();
  if (!touch) input.focus();
})();
</script>
</body>
