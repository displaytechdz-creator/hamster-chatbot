<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max — Assistant produits Hamster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat@0.27.0/dist/style.css" rel="stylesheet">
<style>
  :root {
    /* — marque Hamster — */
    --purple: #6b2d8b;
    --purple-light: #8b4dab;
    --bg-deep: #0f0720;
    --bg-mid: #150a2e;

    /* — chaleur Organic — */
    --terracotta: #c67139;
    --terracotta-light: #f6a06b;
    --terracotta-pale: #ffc6a5;
    --sage: #aebf92;
    --sage-pale: #ccdbb2;

    --ink: #fff6ed;
    --ink-70: rgba(255, 246, 237, .7);
    --ink-55: rgba(255, 246, 237, .55);
    --ink-40: rgba(255, 246, 237, .4);
    --line: rgba(255, 246, 237, .09);
    --line-strong: rgba(255, 246, 237, .14);
    --fill: rgba(255, 246, 237, .06);

    --font-display: 'Caprasimo', Georgia, serif;
    --font-ui: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* — variables du widget @n8n/chat — */
    --chat--color-primary: var(--terracotta);
    --chat--color-primary-shade-50: var(--terracotta-light);
    --chat--color-primary-shade-100: #b2622d;
    --chat--color-secondary: var(--purple);
    --chat--color-secondary-shade-50: var(--purple-light);
    --chat--color-white: transparent;
    --chat--color-light: rgba(255, 246, 237, .06);
    --chat--color-light-shade-50: rgba(255, 246, 237, .08);
    --chat--color-light-shade-100: rgba(255, 246, 237, .12);
    --chat--color-medium: rgba(255, 246, 237, .5);
    --chat--color-dark: var(--ink);
    --chat--color-disabled: rgba(255, 246, 237, .25);
    --chat--color-typing: var(--terracotta-light);
    --chat--font-family: var(--font-ui);
    --chat--border-radius: 22px;
    --chat--spacing: 18px;
    --chat--message--bot--background: rgba(255, 246, 237, .07);
    --chat--message--bot--color: var(--ink);
    --chat--message--bot--border: 1px solid var(--line);
    --chat--message--user--background: var(--purple);
    --chat--message--user--color: var(--ink);
    --chat--message--user--border: none;
    --chat--message--font-size: 15px;
    --chat--message--pre--background: rgba(0, 0, 0, .3);
    --chat--textarea--height: 48px;
    --chat--input--background: transparent;
    --chat--input--text-color: var(--ink);
    --chat--input--font-size: 15px;
    --chat--input--border: none;
    --chat--input--placeholder--font-size: 15px;
    --chat--input--send--button--background: var(--terracotta);
    --chat--input--send--button--color: #2e1508;
    --chat--input--send--button--background-hover: var(--terracotta-light);
    --chat--header--background: transparent;
    --chat--header--color: var(--ink);
    --chat--heading--font-size: 0;
    --chat--subtitle--font-size: 0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: var(--font-ui);
    background: var(--bg-mid);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Deux halos doux, sans grille ni animation de fond */
  .halo { position: fixed; border-radius: 999px; filter: blur(70px); pointer-events: none; z-index: 0; }
  .halo-a { width: 620px; height: 620px; top: -320px; right: -180px; background: radial-gradient(circle, rgba(139, 77, 171, .5), transparent 70%); }
  .halo-b { width: 480px; height: 480px; bottom: -260px; left: -140px; background: radial-gradient(circle, rgba(198, 113, 57, .32), transparent 70%); }

  /* ───────── topbar ───────── */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 26px;
    background: rgba(15, 7, 32, .55);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .mark {
    width: 40px; height: 40px; flex: none;
    border-radius: 14px; background: var(--purple);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 21px; height: 21px; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .brand-sub {
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-40);
  }
  .spacer { flex: 1; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }

  .lang {
    display: flex; gap: 2px; padding: 3px;
    border-radius: 999px; background: var(--fill);
    border: 1px solid rgba(255, 246, 237, .1);
  }
  .lang button {
    padding: 6px 14px; border: 0; border-radius: 999px; cursor: pointer;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em;
    background: transparent; color: var(--ink-55);
    transition: background .18s, color .18s;
  }
  .lang button:hover { color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--terracotta); color: #2e1508; }
  .lang button:active { background: var(--terracotta-light); }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 15px 7px 12px; border-radius: 999px;
    background: rgba(174, 191, 146, .14); border: 1px solid rgba(174, 191, 146, .32);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--sage-pale);
  }
  .status i { width: 7px; height: 7px; border-radius: 999px; background: var(--sage); }

  /* ───────── colonne centrale ───────── */
  main {
    position: relative; z-index: 5;
    flex: 1; min-height: 0;
    display: flex; justify-content: center;
    padding: 0 26px;
  }
  .column {
    width: 100%; max-width: 820px;
    display: flex; flex-direction: column; min-height: 0;
  }

  .hero {
    display: flex; align-items: flex-start; gap: 18px;
    padding: 26px 4px 22px;
    border-bottom: 1px solid rgba(255, 246, 237, .08);
  }
  .avatar-wrap { position: relative; flex: none; }
  .avatar {
    position: relative; width: 58px; height: 58px; border-radius: 20px;
    background: var(--purple);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 26px; color: var(--ink);
  }
  .avatar-glow {
    position: absolute; inset: -4px; border-radius: 22px;
    background: var(--purple-light); opacity: .55;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .5; transform: scale(1); } 50% { opacity: .8; transform: scale(1.06); } }
  .avatar-live {
    position: absolute; bottom: -2px; right: -2px;
    width: 16px; height: 16px; border-radius: 999px;
    background: var(--sage); border: 3px solid var(--bg-mid);
  }
  .hero-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .hero-text h1 {
    font-family: var(--font-display); font-weight: 400;
    font-size: 27px; line-height: 1.12; letter-spacing: -.015em;
  }
  .hero-text p { font-size: 14.5px; line-height: 1.6; color: rgba(255, 246, 237, .62); max-width: 580px; text-wrap: pretty; }
  .caps { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 2px; }
  .cap {
    padding: 6px 13px; border-radius: 999px;
    background: var(--fill); border: 1px solid rgba(255, 246, 237, .12);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--ink-70);
  }
  .cap.warm { background: rgba(246, 160, 107, .12); border-color: rgba(246, 160, 107, .3); color: var(--terracotta-pale); }
  .cap.sage { background: rgba(174, 191, 146, .12); border-color: rgba(174, 191, 146, .3); color: var(--sage-pale); }

  /* ───────── widget n8n ───────── */
  #n8n-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #n8n-chat .chat-layout,
  #n8n-chat .chat-window,
  #n8n-chat .chat-body,
  #n8n-chat .chat-wrapper { background: transparent !important; border: 0 !important; box-shadow: none !important; }
  #n8n-chat .chat-header { display: none !important; }

  #n8n-chat .chat-messages-list { padding: 24px 4px 8px !important; gap: 18px !important; }
  #n8n-chat .chat-messages-list::-webkit-scrollbar { width: 6px; }
  #n8n-chat .chat-messages-list::-webkit-scrollbar-track { background: transparent; }
  #n8n-chat .chat-messages-list::-webkit-scrollbar-thumb { background: rgba(255, 246, 237, .18); border-radius: 999px; }
  #n8n-chat .chat-messages-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 246, 237, .3); }

  #n8n-chat .chat-message {
    max-width: 620px; line-height: 1.6;
    padding: 13px 19px !important;
    border-radius: 22px 22px 22px 8px !important;
    box-shadow: none !important;
  }
  #n8n-chat .chat-message-from-user {
    border-radius: 22px 22px 8px 22px !important;
    max-width: 480px;
  }

  /* Réponses riches : listes, fiches, tableaux, code — lisibles et chauds */
  #n8n-chat .chat-message-markdown > *:not(:last-child) { margin-bottom: 10px; }
  #n8n-chat .chat-message-markdown strong { color: var(--terracotta-pale); font-weight: 600; }
  #n8n-chat .chat-message-markdown a { color: var(--terracotta-light); text-underline-offset: 3px; }
  #n8n-chat .chat-message-markdown a:hover { color: var(--terracotta-pale); }
  #n8n-chat .chat-message-markdown code {
    font-family: var(--font-mono); font-size: 12px;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(255, 246, 237, .1); color: var(--ink-70);
  }
  #n8n-chat .chat-message-markdown pre {
    padding: 14px 16px; border-radius: 18px;
    background: rgba(0, 0, 0, .28); border: 1px solid var(--line);
    overflow-x: auto;
  }
  #n8n-chat .chat-message-markdown ul,
  #n8n-chat .chat-message-markdown ol { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  #n8n-chat .chat-message-markdown li::marker { color: var(--terracotta-light); }
  #n8n-chat .chat-message-markdown table {
    width: 100%; border-collapse: collapse;
    font-size: 13.5px; margin: 4px 0;
  }
  #n8n-chat .chat-message-markdown th {
    text-align: left; padding: 8px 12px;
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-40);
    border-bottom: 1px solid var(--line-strong);
  }
  #n8n-chat .chat-message-markdown td {
    padding: 10px 12px; vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  #n8n-chat .chat-message-markdown tr:last-child td { border-bottom: 0; }
  #n8n-chat .chat-message-markdown h2,
  #n8n-chat .chat-message-markdown h3 {
    font-family: var(--font-display); font-weight: 400;
    font-size: 17px; line-height: 1.2;
  }

  /* Suggestions + saisie */
  .composer { padding: 12px 4px 22px; display: flex; flex-direction: column; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 15px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px solid rgba(255, 246, 237, .16);
    font-family: var(--font-ui); font-size: 12.5px; color: var(--ink-70);
    transition: border-color .18s, color .18s, background .18s;
  }
  .chip:hover { border-color: var(--terracotta-light); color: var(--terracotta-pale); }
  .chip:active { background: rgba(246, 160, 107, .14); }

  #n8n-chat .chat-inputs,
  #n8n-chat .chat-input {
    padding: 8px 8px 8px 22px !important;
    border-radius: 999px !important;
    background: var(--fill) !important;
    border: 1px solid var(--line-strong) !important;
    border-top: 1px solid var(--line-strong) !important;
    display: flex !important; align-items: center !important; gap: 10px !important;
    transition: border-color .18s;
  }
  #n8n-chat .chat-inputs:focus-within,
  #n8n-chat .chat-input:focus-within { border-color: rgba(246, 160, 107, .6) !important; }
  #n8n-chat textarea {
    flex: 1; min-width: 0;
    background: transparent !important; border: 0 !important; outline: none !important;
    font-family: var(--font-ui) !important; font-size: 15px !important;
    color: var(--ink) !important; padding: 10px 0 !important;
    resize: none;
  }
  #n8n-chat textarea::placeholder { color: var(--ink-40) !important; }
  #n8n-chat .chat-inputs-controls,
  #n8n-chat .chat-input-send-button,
  #n8n-chat button[class*="send"] {
    width: 42px !important; height: 42px !important; flex: none;
    border-radius: 999px !important; border: 0 !important;
    background: var(--terracotta) !important; color: #2e1508 !important;
    display: flex !important; align-items: center; justify-content: center;
    cursor: pointer; transition: background .18s;
  }
  #n8n-chat .chat-input-send-button:hover,
  #n8n-chat button[class*="send"]:hover { background: var(--terracotta-light) !important; }
  #n8n-chat .chat-input-send-button svg,
  #n8n-chat button[class*="send"] svg { width: 19px; height: 19px; }
  #n8n-chat .chat-footer,
  #n8n-chat .chat-get-started { display: none !important; }

  :focus-visible { outline: 2px solid var(--terracotta-light); outline-offset: 2px; }
  ::selection { background: rgba(198, 113, 57, .35); }

  .legal {
    position: relative; z-index: 10;
    display: flex; justify-content: center; gap: 10px;
    padding: 12px 26px 16px;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 246, 237, .3);
  }

  @media (max-width: 768px) {
    .topbar { padding: 14px 16px; gap: 11px; }
    .mark { width: 34px; height: 34px; border-radius: 12px; }
    .brand-name { font-size: 13.5px; }
    .brand-sub { display: none; }
    .status { display: none; }
    main { padding: 0 16px; }
    .hero { padding: 20px 0 18px; gap: 13px; }
    .avatar { width: 46px; height: 46px; border-radius: 16px; font-size: 21px; }
    .hero-text h1 { font-size: 21px; }
    .hero-text p { font-size: 12.5px; }
    .caps { display: none; }
    #n8n-chat .chat-messages-list { padding: 18px 0 8px !important; }
    #n8n-chat .chat-message { max-width: 300px; font-size: 14px !important; }
    .composer { padding: 10px 0 18px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; font-size: 12px; padding: 7px 13px; }
    .legal { padding: 8px 16px 14px; font-size: 9px; }
  }
</style>
</head>
<body>

<div class="halo halo-a"></div>
<div class="halo halo-b"></div>

<header class="topbar">
  <div class="mark">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="34" height="34" rx="6" stroke="#fff6ed" stroke-width="3.2"></rect>
      <polyline points="3,37 3,13 13,3" stroke="#fff6ed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
  </div>
  <div class="brand">
    <div class="brand-name">HAMSTER × MAX</div>
    <div class="brand-sub" data-i18n="tagline">Assistant produits</div>
  </div>
  <div class="spacer"></div>
  <div class="topbar-right">
    <div class="lang" role="group" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="status"><i></i><span data-i18n="status">En ligne</span></div>
  </div>
</header>

<main>
  <div class="column">
    <section class="hero">
      <div class="avatar-wrap">
        <div class="avatar-glow"></div>
        <div class="avatar">M</div>
        <div class="avatar-live"></div>
      </div>
      <div class="hero-text">
        <h1 data-i18n="heroTitle">Bonjour, je suis Max</h1>
        <p data-i18n="heroDesc">Je cherche dans le catalogue Hamster : références, compatibilité, garantie, caractéristiques. Posez la question comme vous la diriez à un collègue.</p>
        <div class="caps">
          <span class="cap" data-i18n="cap1">CATALOGUE</span>
          <span class="cap warm" data-i18n="cap2">COMPATIBILITÉ</span>
          <span class="cap sage" data-i18n="cap3">FICHES À JOUR</span>
        </div>
      </div>
    </section>

    <div id="n8n-chat"></div>

    <div class="composer">
      <div class="chips">
        <button type="button" class="chip" data-i18n="chip1">Trouver une référence</button>
        <button type="button" class="chip" data-i18n="chip2">Vérifier une compatibilité</button>
        <button type="button" class="chip" data-i18n="chip3">Conditions de garantie</button>
      </div>
    </div>
  </div>
</main>

<div class="legal">
  <span data-i18n="legal">Usage interne Hamster · Max v4</span>
</div>

<script type="module">
import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat@0.27.0/dist/chat.bundle.es.js';

const WEBHOOK = 'https://n8n.srv1163870.hstgr.cloud/webhook/79723dfd-52fa-4e30-8def-23c0b48aebab/chat';

const COPY = {
  fr: {
    htmlLang: 'fr',
    tagline: 'Assistant produits',
    status: 'En ligne',
    heroTitle: 'Bonjour, je suis Max',
    heroDesc: 'Je cherche dans le catalogue Hamster : références, compatibilité, garantie, caractéristiques. Posez la question comme vous la diriez à un collègue.',
    cap1: 'CATALOGUE',
    cap2: 'COMPATIBILITÉ',
    cap3: 'FICHES À JOUR',
    chip1: 'Trouver une référence',
    chip2: 'Vérifier une compatibilité',
    chip3: 'Conditions de garantie',
    legal: 'Usage interne Hamster · Max v4',
    placeholder: 'Écrivez votre question à Max…',
    greeting: "Salut ! Je suis Max, l'assistant produits Hamster.\n\nDemandez-moi une référence, une compatibilité, une garantie ou les caractéristiques d'un article."
  },
  en: {
    htmlLang: 'en',
    tagline: 'Product assistant',
    status: 'Online',
    heroTitle: "Hi, I'm Max",
    heroDesc: "I search the Hamster catalogue: part numbers, compatibility, warranty, specifications. Ask the way you'd ask a colleague.",
    cap1: 'CATALOGUE',
    cap2: 'COMPATIBILITY',
    cap3: 'LIVE SPEC SHEETS',
    chip1: 'Find a part number',
    chip2: 'Check compatibility',
    chip3: 'Warranty terms',
    legal: 'Hamster internal · Max v4',
    placeholder: 'Ask Max anything…',
    greeting: "Hi! I'm Max, the Hamster product assistant.\n\nAsk me for a part number, a compatibility check, warranty terms or an item's specifications."
  }
};

let lang = localStorage.getItem('max-lang') === 'en' ? 'en' : 'fr';

function paintCopy() {
  const t = COPY[lang];
  document.documentElement.lang = t.htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('.lang button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  });
}

/* Le widget lit sa langue et ses messages au montage : on le remonte au changement.
   `metadata.lang` part avec chaque requête — l'agent n8n s'en sert pour répondre
   dans la bonne langue. */
function mountChat() {
  const host = document.getElementById('n8n-chat');
  host.innerHTML = '';
  const t = COPY[lang];
  createChat({
    webhookUrl: WEBHOOK,
    target: '#n8n-chat',
    mode: 'fullscreen',
    showWelcomeScreen: false,
    initialMessages: [t.greeting],
    metadata: { lang },
    i18n: {
      en: {
        title: '', subtitle: '', footer: '',
        getStarted: lang === 'fr' ? 'Nouvelle conversation' : 'New conversation',
        inputPlaceholder: t.placeholder,
        closeButtonTooltip: lang === 'fr' ? 'Fermer' : 'Close'
      }
    }
  });
}

function sendText(text) {
  const ta = document.querySelector('#n8n-chat textarea');
  if (!ta) return;
  ta.focus();
  ta.value = text;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  requestAnimationFrame(() => {
    ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
  });
}

document.querySelectorAll('.lang button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.lang === lang) return;
    lang = btn.dataset.lang;
    localStorage.setItem('max-lang', lang);
    paintCopy();
    mountChat();
  });
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => sendText(chip.textContent.trim()));
});

paintCopy();
mountChat();
</script>

</body>
</html>
